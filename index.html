<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>贪吃蛇游戏</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #222 0%, #111 40%, #000 100%);
      color: #f5f5f5;
    }

    main {
      width: min(720px, 90vw);
      display: grid;
      gap: 1.5rem;
      justify-items: center;
      text-align: center;
      padding: 2rem 1.5rem 3rem;
      background: rgba(15, 15, 15, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
    }

    h1 {
      font-size: clamp(2.2rem, 5vw, 3rem);
      margin: 0;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      background: linear-gradient(120deg, #7ddcff, #22d3ee, #4ade80);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p {
      max-width: 52ch;
      margin: 0;
      line-height: 1.6;
      opacity: 0.85;
    }

    canvas {
      width: min(480px, 90vw);
      aspect-ratio: 1 / 1;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.5);
    }

    .hud {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      letter-spacing: 0.05em;
    }

    button {
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: #0f172a;
      background: linear-gradient(135deg, #38bdf8, #22d3ee);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 12px 24px rgba(34, 211, 238, 0.35);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 30px rgba(34, 211, 238, 0.45);
    }

    button:active {
      transform: translateY(0);
      box-shadow: 0 8px 18px rgba(34, 211, 238, 0.45);
    }

    @media (max-width: 600px) {
      main {
        padding: 1.5rem 1rem 2.5rem;
        border-radius: 18px;
      }

      .hud {
        flex-direction: column;
        gap: 0.75rem;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>贪吃蛇</h1>
      <p>使用方向键或 W / A / S / D 控制蛇的移动，吃到更多能量方块以刷新高分吧！</p>
    </header>

    <div class="hud">
      <div>当前分数：<span id="score">0</span></div>
      <div>最佳成绩：<span id="best-score">0</span></div>
      <button id="restart">重新开始</button>
    </div>

    <canvas id="board" width="480" height="480"></canvas>
  </main>

  <script>
    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const bestScoreEl = document.getElementById("best-score");
    const restartBtn = document.getElementById("restart");

    const gridSize = 20;
    const tileCount = canvas.width / gridSize;
    const speedIncreaseInterval = 5; // 分数达到这个倍数时加速
    const maxSpeed = 10; // 每秒最多 10 帧

    let snake, food, direction, nextDirection, score, bestScore, frameInterval, frameTimer;

    function resetGame() {
      snake = [
        { x: 9, y: 10 },
        { x: 8, y: 10 },
        { x: 7, y: 10 },
      ];
      direction = { x: 1, y: 0 };
      nextDirection = { ...direction };
      score = 0;
      frameInterval = 150;
      frameTimer = performance.now();
      spawnFood();
      updateScore();
    }

    function spawnFood() {
      let newFood;
      do {
        newFood = {
          x: Math.floor(Math.random() * tileCount),
          y: Math.floor(Math.random() * tileCount),
        };
      } while (snake.some((segment) => segment.x === newFood.x && segment.y === newFood.y));
      food = newFood;
    }

    function updateScore() {
      scoreEl.textContent = score;
      bestScoreEl.textContent = bestScore;
      localStorage.setItem("snake-best-score", bestScore);
    }

    function handleInput(event) {
      const key = event.key.toLowerCase();
      const mapping = {
        arrowup: { x: 0, y: -1 },
        w: { x: 0, y: -1 },
        arrowdown: { x: 0, y: 1 },
        s: { x: 0, y: 1 },
        arrowleft: { x: -1, y: 0 },
        a: { x: -1, y: 0 },
        arrowright: { x: 1, y: 0 },
        d: { x: 1, y: 0 },
      };

      const newDirection = mapping[key];
      if (!newDirection) return;

      // 禁止 180° 转身
      if (newDirection.x === -direction.x && newDirection.y === -direction.y) {
        return;
      }

      nextDirection = newDirection;
    }

    function drawBoard() {
      ctx.fillStyle = "#0b1120";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 绘制棋盘细分线
      ctx.strokeStyle = "rgba(255,255,255,0.04)";
      ctx.lineWidth = 1;
      for (let i = 1; i < tileCount; i++) {
        const offset = i * gridSize;
        ctx.beginPath();
        ctx.moveTo(offset, 0);
        ctx.lineTo(offset, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, offset);
        ctx.lineTo(canvas.width, offset);
        ctx.stroke();
      }
    }

    function drawSnake() {
      snake.forEach((segment, index) => {
        const { x, y } = segment;
        const padding = 2;
        ctx.fillStyle = index === 0 ? "#38bdf8" : "#22d3ee";
        ctx.shadowBlur = index === 0 ? 10 : 6;
        ctx.shadowColor = "#22d3ee";
        ctx.fillRect(
          x * gridSize + padding,
          y * gridSize + padding,
          gridSize - padding * 2,
          gridSize - padding * 2
        );
        ctx.shadowBlur = 0;
      });
    }

    function drawFood() {
      const padding = 4;
      ctx.fillStyle = "#f97316";
      ctx.shadowBlur = 8;
      ctx.shadowColor = "#fb923c";
      ctx.fillRect(
        food.x * gridSize + padding,
        food.y * gridSize + padding,
        gridSize - padding * 2,
        gridSize - padding * 2
      );
      ctx.shadowBlur = 0;
    }

    function update() {
      const now = performance.now();
      if (now - frameTimer < frameInterval) {
        requestAnimationFrame(update);
        return;
      }
      frameTimer = now;

      direction = nextDirection;
      const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

      // 碰撞检测：墙壁
      if (
        head.x < 0 ||
        head.y < 0 ||
        head.x >= tileCount ||
        head.y >= tileCount
      ) {
        gameOver();
        return;
      }

      // 碰撞检测：自身
      if (snake.some((segment) => segment.x === head.x && segment.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 1;
        if (score > bestScore) {
          bestScore = score;
        }
        adjustSpeed();
        spawnFood();
        updateScore();
      } else {
        snake.pop();
      }

      drawScene();
      requestAnimationFrame(update);
    }

    function adjustSpeed() {
      const targetSpeed = Math.min(maxSpeed, 5 + Math.floor(score / speedIncreaseInterval));
      frameInterval = 1000 / targetSpeed;
    }

    function drawScene() {
      drawBoard();
      drawFood();
      drawSnake();
    }

    function gameOver() {
      ctx.fillStyle = "rgba(15, 23, 42, 0.9)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#e2e8f0";
      ctx.font = "bold 36px 'Segoe UI'";
      ctx.textAlign = "center";
      ctx.fillText("游戏结束", canvas.width / 2, canvas.height / 2 - 20);
      ctx.font = "18px 'Segoe UI'";
      ctx.fillText(`本局得分：${score}`, canvas.width / 2, canvas.height / 2 + 14);
      ctx.fillText("点击重新开始按钮继续挑战", canvas.width / 2, canvas.height / 2 + 48);
    }

    restartBtn.addEventListener("click", () => {
      resetGame();
      drawScene();
      requestAnimationFrame(update);
    });

    document.addEventListener("keydown", handleInput);

    function init() {
      bestScore = Number(localStorage.getItem("snake-best-score")) || 0;
      resetGame();
      drawScene();
      requestAnimationFrame(update);
    }

    init();
  </script>
</body>
</html>
